# GrokBot Loop bundle layer — Ideal Topology v1.1 (0.2.0).
#
# Cordis include patches cannot change `name` on an existing id (same-id rename
# is rejected with "name mismatch … skipping"). Disable the stock row, then
# insert a new id that loads this package. AgentFactory is registered by the
# plugin itself, not by the stock entry id.
#
# Uninstall / remove this patch to restore `@deepseek-ai/dsh-agent-loop`.
#
# BREAKING 0.2.0: rpwuOtherMode default is `spawn` (ideal). Set `fold` for
# 0.1.x short-protocol compat. Mount dsh-subagent + spawn-in-process for true
# parallel; without the seam, spawn degrades visibly (never throws).

- id: agent-loop
  disabled: true

- insert:
    - id: grokbot-agent-loop
      name: '@harness-plugins/grokbot-agent-loop'
      config:
        maxParallelToolCalls: 10
        interruptOnSteer: true
        steerFoldHint: true
        steerFoldMode: bot-like
        steerResumeAnchor: true
        rpwuEnabled: true
        # Ideal Topology v1.1 default: spawn (fold = explicit compat).
        rpwuOtherMode: spawn
        rpwuSubagentProvider: spawn
        rpwuSubagentDelivery: caller
        rpwuCheckpointStore: memory
        deliveryGate: true
        deliveryGateMaxRetries: 2
        agents: []
