# Example profile overlay (~/.dsh/profiles/<name>/cordis.patch.yml)
# Cordis cannot rename an existing id's package; disable stock then insert.

- id: agent-loop
  disabled: true

- insert:
    - id: grokbot-agent-loop
      name: '@harness-plugins/grokbot-agent-loop'
      config:
        maxParallelToolCalls: 10
        # Busy Enter / agent.steer() cooperatively cancels mid-stream and claims
        # on the next step. Set false to match stock next-step-wait semantics.
        interruptOnSteer: true
        # After preempt, inject a producer notice: handle OTHER first, then
        # resume the prior unfinished task (prompt-layer fold vs grok.com Bot).
        steerFoldHint: true
        steerFoldMode: bot-like
        steerResumeAnchor: true
        agents: []

# Complementary shortcut (Cmd/Ctrl+Enter) still uses agent.followup() →
# next-turn QueueDock parking — no patch change required for that path.
