# Example profile overlay (~/.dsh/profiles/<name>/cordis.patch.yml)
# Ideal Topology v1.1 / 0.2.0 — default spawn path.
#
# True-parallel OTHER needs host subagent packages in the profile:
#   - id: subagent
#     name: '@deepseek-ai/dsh-subagent'
#   - id: subagent-spawn
#     name: '@deepseek-ai/dsh-subagent-spawn-in-process'
# Optional history-seeded child:
#   - id: subagent-fork
#     name: '@deepseek-ai/dsh-subagent-fork-in-process'
#
# BREAKING: rpwuOtherMode default is spawn. Set fold for 0.1.x short-protocol.

- id: agent-loop
  disabled: true

- insert:
    - id: grokbot-agent-loop
      name: '@harness-plugins/grokbot-agent-loop'
      config:
        maxParallelToolCalls: 10
        interruptOnSteer: true
        steerFoldHint: true
        steerFoldMode: bot-like
        steerResumeAnchor: true
        rpwuEnabled: true
        rpwuOtherMode: spawn
        rpwuSubagentProvider: spawn
        rpwuSubagentDelivery: caller
        rpwuCheckpointStore: memory
        deliveryGate: true
        deliveryGateMaxRetries: 2
        agents: []
