# Example profile overlay (~/.dsh/profiles/<name>/cordis.patch.yml)
# Cordis cannot rename an existing id's package; disable stock then insert.
#
# True-parallel OTHER (P1.5) also needs host subagent packages in the profile,
# for example (add alongside this overlay — names match dsh 0.2.1-rc.3 line):
#   - id: subagent
#     name: '@deepseek-ai/dsh-subagent'
#   - id: subagent-spawn
#     name: '@deepseek-ai/dsh-subagent-spawn-in-process'
# Optional history-seeded child:
#   - id: subagent-fork
#     name: '@deepseek-ai/dsh-subagent-fork-in-process'
# Then set rpwuOtherMode: fork (or subagent) below.

- id: agent-loop
  disabled: true

- insert:
    - id: grokbot-agent-loop
      name: '@harness-plugins/grokbot-agent-loop'
      config:
        maxParallelToolCalls: 10
        # Busy Enter / agent.steer() cooperatively cancels mid-stream and claims
        # on the next step. Set false to match stock next-step-wait semantics.
        interruptOnSteer: true
        # After preempt, inject a producer notice: handle OTHER first, then
        # resume the prior unfinished task (prompt-layer fold vs grok.com Bot).
        steerFoldHint: true
        steerFoldMode: bot-like
        steerResumeAnchor: true
        rpwuEnabled: true
        # fold (default): OTHER folds into MAIN (0.1.7 short-protocol).
        # fork|subagent: start a host child Session via ctx.subagents.startActivation;
        # without dsh-subagent (+ spawn), degrades to registry-only + [grokbot-unit-fork-degraded].
        rpwuOtherMode: fold
        rpwuSubagentProvider: spawn
        rpwuSubagentDelivery: caller
        deliveryGate: true
        deliveryGateMaxRetries: 2
        agents: []

# Complementary shortcut (Cmd/Ctrl+Enter) still uses agent.followup() →
# next-turn QueueDock parking — no patch change required for that path.
